<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora ROI de IA — Hermes Agents | Praia Digital</title>
<meta name="description" content="Quanto sua imobiliária economiza e ganha a mais com agentes de IA? Calcule o retorno da automação.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#faf5ff;color:#1e1b2e;min-height:100vh}
  header{background:linear-gradient(135deg,#6B21A8,#A855F7);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:700px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(100,30,160,.1)}
  h1{font-size:1.5rem;color:#6B21A8}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#6B21A8;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.3rem}
  .linha{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #ede9fe;font-size:.95rem}
  .linha b{color:#6B21A8}
  .destaque{background:#f5f3ff;border:1px solid #c4b5fd;border-radius:12px;padding:1rem;margin-top:.8rem;text-align:center}
  .destaque b{font-size:1.6rem;color:#6B21A8}
  .dica{margin-top:1rem;background:#f5f3ff;border:1px solid #c4b5fd;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/hermes-agents">← Hermes Agents</a>
</header>
<main>
  <div class="card">
    <h1>🤖 Calculadora ROI de IA</h1>
    <p class="sub">Quanto vale automatizar o atendimento da sua imobiliária com agentes Hermes?</p>
    <label>Leads recebidos por mês</label><input type="number" id="leads" value="120">
    <label>Taxa de resposta atual (% dos leads que recebem retorno)</label><input type="number" id="resp" value="60">
    <label>Taxa de conversão em vendas (% dos leads respondidos)</label><input type="number" id="conv" value="3" step="0.5">
    <label>Comissão média por venda (R$)</label><input type="number" id="comissao" value="25000" step="5000">
    <button onclick="calc()">Calcular impacto da IA</button>
    <div id="out"></div>
    <div class="dica">🎮 Teste o atendimento no <a href="https://praia.digital/hermes-agents/playground/" style="color:#6B21A8;font-weight:700">Playground Hermes</a> · 💼 Ferramentas no <a href="https://praia.digital/portal-corretores" style="color:#6B21A8;font-weight:700">Portal do Corretor</a></div>
  </div>
</main>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
function calc(){
  var L=parseFloat(document.getElementById('leads').value)||0;
  var r=parseFloat(document.getElementById('resp').value)/100||0;
  var c=parseFloat(document.getElementById('conv').value)/100||0;
  var com=parseFloat(document.getElementById('comissao').value)||0;
  var vendasHoje=L*r*c;
  var vendasIA=L*1.0*c*1.3; // IA responde 100% e converte +30% por velocidade
  var ganho=(vendasIA-vendasHoje)*com;
  document.getElementById('out').innerHTML=
    '<div class="linha"><span>Vendas/mês hoje</span><b>'+vendasHoje.toFixed(1)+'</b></div>'+
    '<div class="linha"><span>Vendas/mês com Hermes (100% resposta, +30% conversão)</span><b>'+vendasIA.toFixed(1)+'</b></div>'+
    '<div class="destaque">Receita adicional estimada<br><b>'+fmt(ganho)+'/mês</b><br><small>'+fmt(ganho*12)+' por ano</small></div>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
